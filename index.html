<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CurlyTag Playground</title>
        <link rel="stylesheet" href="playground.css" />
    </head>
    <body>
        <!-- Hidden radios for CSS-only theme switching -->
        <input type="radio" name="theme" id="theme-auto" checked class="sr-only" />
        <input type="radio" name="theme" id="theme-light" class="sr-only" />
        <input type="radio" name="theme" id="theme-dark" class="sr-only" />

        <!-- Animated gradient mesh background -->
        <div class="bg-mesh" aria-hidden="true"></div>

        <div class="container">
            <div class="playground">
                <!-- ─── Header ───────────────────────────────────────── -->
                <header class="playground__header">
                    <div class="playground__brand">
                        <span class="playground__logo" aria-hidden="true">◈</span>
                        <span class="playground__title">CurlyTag</span>
                        <span class="playground__badge">Playground</span>
                    </div>

                    <div class="playground__controls">
                        <button class="examples__trigger" popovertarget="examples-panel">
                            Examples ▾
                        </button>

                        <div class="theme-switch">
                            <label class="theme-switch__option" for="theme-light" title="Light"
                                >☀</label
                            >
                            <label class="theme-switch__option" for="theme-auto" title="Auto"
                                >◐</label
                            >
                            <label class="theme-switch__option" for="theme-dark" title="Dark"
                                >☾</label
                            >
                        </div>
                    </div>
                </header>

                <!-- ─── Main Grid ────────────────────────────────────── -->
                <main class="playground__main">
                    <!-- Template panel -->
                    <section class="panel panel--template">
                        <div class="panel__head">
                            <span>
                                <span class="panel__dot panel__dot--indigo"></span>
                                Template
                            </span>
                            <div class="panel__actions">
                                <button
                                    type="button"
                                    class="panel__action"
                                    data-editor-action="copy-template"
                                >
                                    Copy
                                </button>
                                <button
                                    type="button"
                                    class="panel__action"
                                    data-editor-action="reset-template"
                                    hidden
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                        <div id="template-editor" class="panel__body panel__body--editor"></div>
                    </section>

                    <!-- Data panel -->
                    <section class="panel panel--data">
                        <div class="panel__head">
                            <span>
                                <span class="panel__dot panel__dot--ochre"></span>
                                Data
                                <small class="panel__meta">JSON</small>
                            </span>
                            <div class="panel__actions">
                                <button
                                    type="button"
                                    class="panel__action"
                                    data-editor-action="copy-data"
                                >
                                    Copy
                                </button>
                                <button
                                    type="button"
                                    class="panel__action"
                                    data-editor-action="reset-data"
                                    hidden
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                        <div id="data-editor" class="panel__body panel__body--editor"></div>
                    </section>

                    <output class="panel panel--output">
                        <div class="panel__head">
                            <span>
                                <span class="panel__dot panel__dot--moss"></span>
                                Output
                            </span>
                        </div>
                        <div id="output-source" class="panel__body panel__body--output">
                            <div id="output-source-code"></div>
                        </div>
                    </output>
                </main>
            </div>
        </div>

        <!-- ─── Examples Popover (Anchor-Positioned) ─────────────── -->
        <div id="examples-panel" popover class="examples__popover">
            <button class="examples__item" data-example="category">Product Page</button>
            <button class="examples__item" data-example="loop">Loops &amp; Iteration</button>
            <button class="examples__item" data-example="conditions">Conditionals</button>
            <button class="examples__item" data-example="filters">Filters</button>
            <button class="examples__item" data-example="set">Set Variables</button>
            <button class="examples__item" data-example="nested">Nested Logic</button>
        </div>

        <script type="module" src="./playground.js"></script>
    </body>
</html>
