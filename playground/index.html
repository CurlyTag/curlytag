<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CurlyTag Playground</title>
        <script>
            document.documentElement.classList.toggle(
                'dark',
                window.matchMedia('(prefers-color-scheme: dark)').matches,
            );
        </script>
        <link rel="stylesheet" href="./playground.css" />
    </head>
    <body class="playground-page">
        <div class="bg-mesh" aria-hidden="true"></div>

        <div id="playground-root"></div>

        <script type="module">
            import playgroundMarkup from './playground-markup.html?raw';
            import { init } from './playground.js';

            const root = document.getElementById('playground-root');

            if (root) {
                root.innerHTML = playgroundMarkup;
                init(root);
            }
        </script>
    </body>
</html>
